# Default Configuration for Knowledge Graph Extraction Pipeline

# Data Ingestion Settings
ingestion:
  min_text_length: 10
  max_text_length: 100000
  supported_formats:
    - .json
    - .csv
    - .xlsx
    - .xls
    - .pdf
    - .docx
    - .txt

# Data Validation Settings
validation:
  enabled: true
  min_text_length: 10
  max_text_length: 100000
  min_alpha_ratio: 0.5
  min_quality_score: 0.3
  remove_urls: true
  remove_emails: true
  deduplicate: true

# Knowledge Graph Extraction Settings
extraction:
  spacy_model: "en_core_web_sm"
  batch_size: 50
  enable_all_methods: true
  methods:
    spacy_ner: true
    noun_phrases: true
    single_tokens: true
    verb_relationships: true
    preposition_relationships: true
    dependency_paths: true
    syntactic_patterns: true
    semantic_proximity: true

# Output Settings
output:
  base_dir: "data/output"
  formats:
    - json
    - csv
  save_state: true
  create_summary: true

# Neo4j Settings
neo4j:
  enabled: false
  uri: "bolt://localhost:7687"
  username: "neo4j"
  password: "password"
  clear_database: true
  confidence_threshold: 0.5
  entity_batch_size: 1000
  relationship_batch_size: 500

# Logging Settings
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pipeline.log"
  console: true

# Pipeline Settings
pipeline:
  input_dir: "data/raw"
  processed_dir: "data/processed"
  output_dir: "data/output"
  convert_to_json: true
  json_batch_size: 1000
